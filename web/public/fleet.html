<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fleet · cross-host 8</title>
<style>
  :root { --bg:#0a0b0d; --fg:#c9d1d9; --dim:#6b7280; --line:#20242b; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --acc:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; padding:16px; }
  h1 { font-size:13px; font-weight:600; letter-spacing:.06em; margin:0 0 2px; }
  .sub { color:var(--dim); font-size:11px; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; }
  .host { border:1px solid var(--line); border-radius:8px; padding:12px 14px; background:#0e1014; }
  .host h2 { font-size:13px; margin:0 0 8px; display:flex; align-items:center; gap:8px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); flex:none; }
  .dot.up { background:var(--ok); } .dot.down { background:var(--bad); }
  .kind { color:var(--dim); font-size:10px; font-weight:400; margin-left:auto; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-top:1px solid #16181d; }
  .row .k { color:var(--dim); } .row .v { text-align:right; }
  .bar { height:6px; border-radius:3px; background:#16181d; overflow:hidden; margin-top:2px; }
  .bar > i { display:block; height:100%; background:var(--ok); }
  .bar > i.mid { background:var(--warn); } .bar > i.hi { background:var(--bad); }
  .seats { color:var(--acc); font-size:11px; word-break:break-word; }
  .warn { color:var(--warn); font-size:11px; margin-top:6px; }
  .off { color:var(--bad); }
  .foot { color:var(--dim); font-size:11px; margin-top:14px; }
</style>
</head>
<body>
  <h1>FLEET · everything the wire can see</h1>
  <div class="sub" id="sub">polling…</div>
  <div class="grid" id="grid"></div>
  <div class="foot" id="foot"></div>

<script>
const HOSTS = [
  { name: 'mac · lt-mbp-490',   base: 'http://127.0.0.1:7070',      kind: 'origin (local)' },
  { name: 'omarchy · home',     base: 'http://100.83.251.102:7070', kind: 'tailscale' },
];
const CEIL = 0.5; // the <50% action gate

async function get(base, path, ms = 3500) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(base + path, { signal: c.signal, cache: 'no-store' }); clearTimeout(t); return r.ok ? await r.json() : null; }
  catch { clearTimeout(t); return null; }
}
// /health, returning the X-8-Ledger-Id header too (exposed via CORS) — its delta
// between polls is the host's wire-activity rate (acts on its 8, per interval).
const _led = {}; // base -> { id, t }
async function health(base) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), 3500);
  try {
    const r = await fetch(base + '/health', { signal: c.signal, cache: 'no-store' }); clearTimeout(t);
    if (!r.ok) return { alive: false };
    const j = await r.json(); const id = Number(r.headers.get('X-8-Ledger-Id')); const now = Date.now();
    let rate = null; const p = _led[base];
    if (p && Number.isFinite(id) && now > p.t) rate = Math.max(0, (id - p.id) / ((now - p.t) / 1000));
    if (Number.isFinite(id)) _led[base] = { id, t: now };
    return { ...j, _ledger: id, _rate: rate };
  } catch { clearTimeout(t); return { alive: false }; }
}
function utilOf(b) { if (!b) return null; const x = b.five_h_util ?? b.budget?.five_h_util; return (x === undefined) ? null : x; }
function esc(s){ return String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

async function pollHost(h) {
  const [hp, budget, nodes, hr] = await Promise.all([ health(h.base), get(h.base,'/budget'), get(h.base,'/nodes'), get(h.base,'/hostres') ]);
  const up = !!(hp && hp.alive !== false);
  const seats = (hp?.sessions) || (nodes?.nodes || []).map(n => n.seat || n.id);
  const containers = (nodes?.nodes || []).filter(n => n.mode === 'container').map(n => n.id);
  const util = utilOf(budget);
  const usageUnfed = budget && budget.budget === null;
  return { h, up, seats, containers, util, usageUnfed, rate: hp?._rate, hr };
}
function pctBar(pct, midAt=70, hiAt=90) {
  const cls = pct >= hiAt ? 'hi' : pct >= midAt ? 'mid' : '';
  return `<div class="bar"><i class="${cls}" style="width:${Math.min(100,Math.max(0,pct))}%"></i></div>`;
}
function usageCell(s) {
  if (s.util == null) return `<span class="off">${s.usageUnfed ? 'no sensor (untapped pane)' : '—'}</span>`;
  const pct = Math.round(s.util*100), cls = s.util >= CEIL ? 'hi' : s.util >= CEIL*0.7 ? 'mid' : '';
  return `${pct}% ${s.util>=CEIL?'· OVER GATE':''}<div class="bar"><i class="${cls}" style="width:${Math.min(100,pct)}%"></i></div>`;
}
function cpuRow(hr) {
  if (!hr || !hr.cpus) return '';
  const pct = Math.round((hr.load1 / hr.cpus) * 100);
  return `<div class="row"><span class="k">cpu load</span><span class="v">${hr.load1.toFixed(2)} / ${hr.cpus} cores · ${pct}%${pct>=100?' · OVERLOADED':''}${pctBar(pct)}</span></div>`;
}
function memRow(hr) {
  if (!hr || !hr.mem_total_mb) return '';
  const pct = Math.round((hr.mem_used_mb / hr.mem_total_mb) * 100);
  return `<div class="row"><span class="k">memory</span><span class="v">${(hr.mem_used_mb/1024).toFixed(1)} / ${(hr.mem_total_mb/1024).toFixed(0)} GB · ${pct}%${pctBar(pct)}</span></div>`;
}
function card(s) {
  const seats = s.seats && s.seats.length ? esc(s.seats.join(', ')) : '<span class="off">none</span>';
  const warns = [];
  if (!s.up) warns.push('unreachable over the wire');
  if (s.usageUnfed) warns.push('Claude usage invisible — pane needs BUN_INSPECT + /panes/tap');
  if (s.util != null && s.util >= CEIL) warns.push('over the 50% gate — an action rule would throttle here');
  if (s.hr && s.hr.cpus && s.hr.load1 >= s.hr.cpus) warns.push(`cpu OVERLOADED (load ${s.hr.load1.toFixed(1)} > ${s.hr.cpus} cores) — a throttle rule would fire here`);
  return `<div class="host">
    <h2><span class="dot ${s.up?'up':'down'}"></span>${esc(s.h.name)}<span class="kind">${esc(s.h.kind)}</span></h2>
    <div class="row"><span class="k">8 collector</span><span class="v">${s.up?'live':'<span class=off>down</span>'}</span></div>
    <div class="row"><span class="k">Claude 5h usage</span><span class="v">${usageCell(s)}</span></div>
    <div class="row"><span class="k">wire activity</span><span class="v">${s.rate == null ? '<span class=k>·</span>' : s.rate.toFixed(1) + ' acts/s'}</span></div>
    ${cpuRow(s.hr)}${memRow(s.hr)}
    <div class="row"><span class="k">seats</span><span class="v seats">${seats}</span></div>
    <div class="row"><span class="k">containers</span><span class="v">${s.containers.length?esc(s.containers.join(', ')):'<span class=k>—</span>'}</span></div>
    ${warns.map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join('')}
  </div>`;
}
// The inner host: the colima VM + its containers, via the mac's /container
// (docker stats + colima list). Not an 8 of its own — the claude-web sandbox
// runs elsewhere (account-side) — but its container CPU/mem IS visible here.
async function innerCard() {
  const c = await get('http://127.0.0.1:7070', '/container', 9000); // docker stats is slow, esp. under load
  if (!c || (!c.docker_ok && !(c.vms||[]).length)) return '';
  const vm = (c.vms || [])[0];
  const rows = (c.containers || []).sort((a,b)=>parseFloat(b.cpu)-parseFloat(a.cpu)).slice(0,6).map(ct => {
    const cpu = parseFloat(ct.cpu)||0, mem = parseFloat(ct.mem_pc)||0;
    return `<div class="row"><span class="k seats">${esc(ct.name)}</span><span class="v">cpu ${ct.cpu} · mem ${mem.toFixed(0)}%</span></div>`;
  }).join('');
  return `<div class="host">
    <h2><span class="dot ${c.colima_ok?'up':'down'}"></span>inner · colima<span class="kind">container host</span></h2>
    <div class="row"><span class="k">vm</span><span class="v">${vm?`${esc(vm.status)} · ${esc(vm.arch)} · ${esc(vm.cpus)} cpu · ${esc(vm.memory)} · ${esc(vm.runtime)}`:'<span class=off>none</span>'}</span></div>
    <div class="row"><span class="k">containers (by cpu)</span><span class="v">${(c.containers||[]).length}</span></div>
    ${rows}
    <div class="warn">⚠ claude-web sandbox usage is account-side, not visible here — only its container's cpu/mem is</div>
  </div>`;
}
// ADAPTIVE APERTURE (the 8 Resource-Manager pattern, applied to this observer so
// it doesn't add the load it measures): the poll interval WIDENS under host load
// and NARROWS when idle; the expensive /container (docker stats) sensor is
// rate-limited to 1-in-3 ticks and cached between; and polling PAUSES when the
// tab is unwatched. Observation that regulates its own cost — not withdrawal.
let apertureMs = 3000, tickN = 0, timer, lastInner = '';
function apertureFor(states) {
  let maxLoad = 0;
  for (const s of states) if (s.hr && s.hr.cpus) maxLoad = Math.max(maxLoad, s.hr.load1 / s.hr.cpus);
  if (maxLoad >= 1.0) return { ms: 9000, note: `aperture NARROW · a host is overloaded (${Math.round(maxLoad*100)}%) — backing off` };
  if (maxLoad >= 0.7) return { ms: 5000, note: `aperture · host load ${Math.round(maxLoad*100)}% — easing` };
  if (maxLoad < 0.4)  return { ms: 2500, note: `aperture WIDE · headroom (load ${Math.round(maxLoad*100)}%)` };
  return { ms: 3500, note: `aperture · load ${Math.round(maxLoad*100)}%` };
}
async function tick() {
  if (document.hidden) { schedule(4000); return; }              // don't sense when nobody's watching
  tickN++;
  const pollInner = tickN % 3 === 1;                            // docker stats is heavy -> rate-limit to 1/3
  const [states, inner] = await Promise.all([ Promise.all(HOSTS.map(pollHost)), pollInner ? innerCard() : Promise.resolve(lastInner) ]);
  if (pollInner) lastInner = inner;
  document.getElementById('grid').innerHTML = states.map(card).join('') + lastInner;
  const upN = states.filter(s => s.up).length;
  const ap = apertureFor(states); apertureMs = ap.ms;
  document.getElementById('sub').textContent = `${upN}/${HOSTS.length} hosts reachable · ${ap.note} · updated ${new Date().toLocaleTimeString()}`;
  document.getElementById('foot').innerHTML =
    'observe-half with an adaptive aperture: poll interval widens under host load, narrows on headroom; docker-stats rate-limited 1/3; pauses when unwatched. ' +
    'the missing ACT-half = throttle a host that crosses a line (50% usage, or cpu overload).';
  schedule(apertureMs);
}
function schedule(ms) { clearTimeout(timer); timer = window.setTimeout(tick, ms); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) schedule(200); });
tick();
</script>
</body>
</html>
