name: ci

# The same gate http-mcp has carried since July, now on every arm of the
# four-system (v0.0.2 audit: CI to all arms). The Go module is collector/;
# build.sh at the root is the canonical build (ONE bundled binary), so CI
# builds through it, then vets, tests and gofmt-checks the module.
# The `web` job gates the cockpit (web/): npm run build IS tsc -b && vite build,
# so it type-checks too — until now no CI touched web/ and cockpit type errors
# couldn't fail a build — then vitest runs the cardSize/setUnit layout arithmetic.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: collector/go.sum
      - run: ./build.sh
      - run: go vet ./...
        working-directory: collector
      - run: go test ./...
        working-directory: collector
      - run: gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt
        working-directory: collector

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build   # tsc -b && vite build — the cockpit's type + build gate
        working-directory: web
      - run: npm test        # vitest: cardSize/setUnit layout arithmetic (the regime boundary)
        working-directory: web
